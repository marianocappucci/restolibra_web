services:
  restolibra-web:
    build: .
    image: restolibra-web:latest
    container_name: restolibra-web
    restart: unless-stopped
    ports:
      - "8079:80"
    networks:
      - stack-net
    depends_on:
      - auth

  auth:
    build:
      context: ./auth
      ssh:
        - default=${LIBRA_WEB_KIT_SSH_KEY:-~/.ssh/id_ed25519_libra_web_kit}
    image: restolibra-web-auth:latest
    container_name: restolibra-web-auth
    restart: unless-stopped
    environment:
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
      - SECRET_KEY=${DOCS_SESSION_SECRET:-restolibra-docs-secret-change-me}
      - APEX_DOMAIN=${APEX_DOMAIN:-restolibra.com.ar}
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
