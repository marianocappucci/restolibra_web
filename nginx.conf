server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript;

    location = /404.html {
        internal;
    }

    # Backend de acceso a /docs/ (login/logout de documentación)
    location /login-docs {
        proxy_pass http://restolibra-web-auth:8000;
        proxy_set_header Host $host;
    }

    location /logout-docs {
        proxy_pass http://restolibra-web-auth:8000;
        proxy_set_header Host $host;
    }

    # Chequeo interno usado por auth_request — nunca accesible directamente
    location = /internal/check-docs-auth {
        internal;
        proxy_pass http://restolibra-web-auth:8000/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /docs/ {
        auth_request /internal/check-docs-auth;
        error_page 401 = @docs_login_redirect;
        try_files $uri $uri/ $uri.html =404;
    }

    location @docs_login_redirect {
        return 302 /login-docs;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
