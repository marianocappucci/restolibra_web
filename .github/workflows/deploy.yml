name: Deploy a VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync archivos al VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='.github' --exclude='*.md' --exclude='.claude' --exclude='.env'
          path: ./
          remote_path: /root/restolibra_web/
          remote_host: 149.50.136.218
          remote_port: 5384
          remote_user: root
          remote_key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Rebuild y restart Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 149.50.136.218
          port: 5384
          username: root
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            cd /root/restolibra_web
            docker compose build --no-cache
            docker compose up -d
            echo "Deploy OK: $(date)"
